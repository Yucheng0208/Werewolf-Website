<title>天黑請閉眼</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* Layout: phone-first single column. Setup (count + role tiles + sticky summary bar) → deal stage (prompt, 3D card, one action) → done / judge list. Deliberately one dark "moonlit night" look. */
:root{
  color-scheme: dark;
  --night:#0d1120;
  --night-2:#151a2d;
  --panel:#1a2035;
  --panel-2:#222a44;
  --line:#2e3654;
  --moon:#efe9d6;
  --mist:#9ba4be;
  --brass:#d6b06a;
  --brass-ink:#1b1408;
  --blood:#d04a42;
  --good:#7fb069;
  --display:"Noto Serif TC","Songti TC","STSong",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, #26305a55, transparent 60%),
    radial-gradient(900px 500px at -10% 110%, #3a182255, transparent 60%),
    var(--night);
  background-attachment: fixed;
  color:var(--moon);
  font-family:var(--body);
  font-size:15px;
  line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
button:disabled{cursor:not-allowed}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 0}

/* header */
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.moon{width:34px;height:34px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 35%, #fffbe9, #e7dcb6 55%, #b9a979);
  box-shadow:0 0 24px #efe2b244, inset -7px -4px 0 #0d112033}
.logo{width:56px;height:56px;flex:none;filter:drop-shadow(0 0 14px #7f8fff55)}
.logo.big{width:120px;height:120px}
.brand h1{font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:.12em;margin:0}
.brand p{margin:0;color:var(--mist);font-size:13px}

/* setup */
.section{margin-bottom:26px}
.label{font-size:12px;letter-spacing:.18em;color:var(--mist);margin:0 0 10px;font-weight:500}
.count-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);font-size:20px;line-height:1}
.stepper button:hover:not(:disabled){border-color:var(--brass)}
.stepper button:disabled{opacity:.35}
.big-num{font-family:var(--display);font-weight:900;font-size:40px;min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.count-row .unit{color:var(--mist)}
.auto{margin-left:auto;border:1px solid var(--brass);background:transparent;color:var(--brass);
  border-radius:999px;padding:8px 16px;font-weight:500}
.auto:hover{background:#d6b06a1a}

.camp-head{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px}
.camp-head h3{margin:0;font-family:var(--display);font-size:17px;letter-spacing:.08em}
.camp-head span{font-size:12px;color:var(--mist)}
.camp-head i{flex:1;height:1px;background:var(--line);align-self:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.tile{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);transition:border-color .2s, background .2s}
.tile.on{border-color:var(--c2);background:linear-gradient(90deg, color-mix(in srgb, var(--c1) 30%, var(--panel)), var(--panel) 70%)}
.chip{width:44px;height:44px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--c1),var(--c2));font-family:var(--display);font-weight:900;font-size:22px;color:#fff;
  text-shadow:0 1px 2px #0006;box-shadow:inset 0 0 0 1px #ffffff40}
.tile .txt{flex:1;min-width:0}
.tile .nm{font-weight:700;font-size:15px}
.tile .ds{font-size:12px;color:var(--mist);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .stepper button{width:32px;height:32px;font-size:17px}
.tile .n{min-width:1.6ch;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.switch{width:50px;height:30px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mist);transition:transform .2s, background .2s}
.switch[aria-pressed="true"]{background:var(--c2);border-color:var(--c2)}
.switch[aria-pressed="true"]::after{transform:translateX(20px);background:#fff}

.bar{position:sticky;bottom:0;margin-top:24px;margin-inline:-4px;z-index:5;
  padding:12px 4px calc(14px + env(safe-area-inset-bottom, 0px));
  background:linear-gradient(to top, var(--night) 70%, transparent)}
.bar-inner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--night-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:0 10px 30px #0008}
.sum{flex:1;min-width:0}
.sum b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.sum .st{font-size:13px}
.st.ok{color:var(--good)} .st.bad{color:var(--blood)}
.mix{font-size:12px;color:var(--mist)}
.primary{border:0;border-radius:999px;padding:12px 26px;font-weight:700;font-size:16px;letter-spacing:.1em;
  background:linear-gradient(180deg,#e6c27c,#c99a4b);color:var(--brass-ink);box-shadow:0 6px 18px #d6b06a33}
.primary:disabled{background:var(--panel-2);color:var(--mist);box-shadow:none}
.ghost{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:10px 18px}
.ghost:hover{border-color:var(--mist)}

/* deal stage */
.stage{min-height:calc(100vh - 40px);display:flex;flex-direction:column;align-items:center;gap:18px;padding-bottom:24px}
.topline{width:100%;max-width:440px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--mist)}
.topline .ghost{padding:6px 14px;font-size:13px}
.dots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:440px}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots span.done{background:var(--brass)}
.dots span.now{background:var(--moon);box-shadow:0 0 0 3px #efe9d633}
.prompt{text-align:center;min-height:84px}
.prompt h2{font-family:var(--display);font-weight:900;font-size:clamp(26px,7vw,34px);margin:0;letter-spacing:.06em;text-wrap:balance}
.prompt h2 em{font-style:normal;color:var(--brass)}
.prompt p{margin:4px 0 0;color:var(--mist);font-size:14px}

.scene{width:min(84vw,340px);aspect-ratio:63/88;max-width:100%;perspective:1600px;container-type:inline-size}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1);cursor:pointer;border-radius:18px}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
/* holographic foil frame shared by both faces */
.back,.front{
  background:linear-gradient(115deg,#f7d774 0%,#fff3b8 8%,#ff9fcf 16%,#9fd8ff 24%,#b9ffc4 32%,#f7d774 40%,#d99a2b 48%,#fff3b8 56%,#ff9fcf 64%,#9fd8ff 72%,#f7d774 80%,#c98a24 90%,#f7d774 100%);
  background-size:300% 300%;animation:holo 7s linear infinite;
  box-shadow:0 18px 50px #000a, inset 0 0 0 .5cqw #fff8, inset 0 0 0 1cqw #7a4e1255}
@keyframes holo{to{background-position:300% 300%}}
.back{display:grid;place-items:center}
.back::before{content:"";position:absolute;inset:3.4cqw;border-radius:3cqw;border:.7cqw solid #ecc76c;
  background:
    repeating-linear-gradient(45deg, #d6b06a1a 0 2px, transparent 2px 16px),
    repeating-linear-gradient(-45deg, #d6b06a1a 0 2px, transparent 2px 16px),
    radial-gradient(circle at 50% 40%, #2c3770, #0f1428 70%);
  box-shadow:inset 0 0 6cqw #000c}
.back .seal{width:46%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 38% 36%, #fffbe9, #e8dcb4 55%, #b3a271);
  box-shadow:0 0 40px #efe2b255, inset -14px -8px 0 #0f142844}
.back .seal b{font-family:var(--display);font-weight:900;font-size:clamp(36px,11vw,54px);color:#1b2140;opacity:.85}
.back .hint{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:13px;letter-spacing:.3em;color:var(--brass)}
/* ---- TCG card face ---- */
.front{transform:rotateY(180deg);padding:3.4cqw;color:#fff;--gold:#ecc76c;--gold-hi:#fff4c4;--gold-lo:#9c6a1c}
.front.blank *{visibility:hidden}
.tc{position:relative;height:100%;border-radius:3cqw;overflow:hidden;border:.7cqw solid var(--gold);
  box-shadow:inset 0 0 0 .35cqw #3a1d05, inset 0 0 8cqw #000a;
  background:linear-gradient(180deg, color-mix(in srgb, var(--c1) 70%, #08060c), #0d0810 72%);
  display:flex;flex-direction:column;padding:2.4cqw;gap:1.6cqw}
.art{position:absolute;inset:0 0 34% 0;background-size:cover;background-position:center 20%;
  -webkit-mask:linear-gradient(to bottom,#000 70%,transparent);mask:linear-gradient(to bottom,#000 70%,transparent)}
.gen{position:absolute;inset:0 0 34% 0;overflow:hidden;
  -webkit-mask:linear-gradient(to bottom,#000 70%,transparent);mask:linear-gradient(to bottom,#000 70%,transparent);
  background:
    radial-gradient(circle at 66% 40%, #fff8de 0 15%, #f1dfa6 15.5%, transparent 16.5%),
    radial-gradient(circle at 66% 40%, #fff1c455 0 22%, transparent 40%),
    radial-gradient(1px 1px at 12% 22%, #fff 99%, transparent), radial-gradient(1px 1px at 28% 12%, #fff 99%, transparent),
    radial-gradient(1.5px 1.5px at 44% 30%, #fff 99%, transparent), radial-gradient(1px 1px at 86% 18%, #fff 99%, transparent),
    radial-gradient(1px 1px at 92% 52%, #fff 99%, transparent), radial-gradient(1.5px 1.5px at 18% 48%, #fff 99%, transparent),
    linear-gradient(180deg, #120d22, color-mix(in srgb, var(--c1) 80%, #120d22) 75%)}
.gen::after{content:"";position:absolute;left:0;right:0;bottom:12%;height:26%;background:#07050c;
  clip-path:polygon(0 100%,0 55%,6% 55%,6% 30%,9% 18%,12% 30%,12% 55%,22% 55%,22% 40%,30% 40%,30% 62%,48% 62%,48% 38%,52% 22%,56% 38%,56% 62%,70% 62%,70% 46%,78% 46%,78% 28%,81% 10%,84% 28%,84% 50%,100% 50%,100% 100%)}
.gen b{position:absolute;left:6%;top:14%;font-family:var(--display);font-weight:900;font-size:56cqw;line-height:1;
  color:transparent;background:linear-gradient(180deg,#fff,var(--c2) 60%,color-mix(in srgb, var(--c2) 40%, #000));-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 0 3cqw color-mix(in srgb, var(--c2) 70%, transparent));opacity:.95}
.tc-top{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1.4cqw}
.campb{display:flex;align-items:center;gap:1cqw;font-size:3.4cqw;font-weight:700;letter-spacing:.06em;white-space:nowrap;
  padding:.8cqw 2.2cqw .8cqw 1cqw;border:.4cqw solid var(--gold);border-radius:1.2cqw 4cqw 1.2cqw 4cqw;
  background:linear-gradient(180deg,color-mix(in srgb, var(--c1) 85%, #000),#1a0a0e);box-shadow:0 0 2cqw #0009}
.campb i{font-style:normal;width:5cqw;height:5cqw;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#3a1405;font-family:var(--display);font-weight:900;font-size:3cqw}
.title{margin:0;text-align:center;font-family:var(--display);font-weight:900;font-size:12.5cqw;line-height:1;letter-spacing:.04em;white-space:nowrap;
  color:transparent;background:linear-gradient(180deg,var(--gold-hi) 10%,#f4cf6a 50%,var(--gold-lo) 95%);-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 .5cqw 0 #3a0808) drop-shadow(0 0 2.5cqw #000c)}
.title.long{font-size:9.5cqw}
.rar{width:14cqw;aspect-ratio:1;display:grid;place-items:center;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;font-size:6cqw;
  clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:linear-gradient(160deg,#fff3c0,#c58a26);position:relative}
.rar::before{content:"";position:absolute;inset:.8cqw;clip-path:inherit;background:radial-gradient(circle at 40% 30%,#4a2a6a,#160a22)}
.rar span{position:relative;color:transparent;-webkit-background-clip:text;background-clip:text;background-image:var(--rg)}
.r-UR{--rg:linear-gradient(120deg,#ff8ab8,#ffe27a,#8ff0ff,#c49bff)}
.r-SSR{--rg:linear-gradient(180deg,#fff6cf,#f2c55a,#b07a1e)}
.r-SR{--rg:linear-gradient(180deg,#f2deff,#b47cff)}
.r-R{--rg:linear-gradient(180deg,#e8f6ff,#7fb6e6)}
.r-SSR .rar-in,.rar.r-SSR{font-size:4.6cqw}
.spacer{flex:1}
.skill{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:2cqw;padding:1cqw 2cqw 1cqw 0;
  border-top:.4cqw solid var(--gold);border-bottom:.4cqw solid var(--gold);
  background:linear-gradient(90deg,color-mix(in srgb, var(--c1) 80%, #000) 0%, #1c0c12cc 70%, #0000)}
.hex{width:11cqw;aspect-ratio:1;display:grid;place-items:center;margin-left:-.6cqw;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);
  background:linear-gradient(160deg,var(--gold-hi),var(--gold-lo));position:relative}
.hex::before{content:"";position:absolute;inset:.8cqw;clip-path:inherit;background:linear-gradient(160deg,var(--c2),color-mix(in srgb, var(--c1) 60%, #000))}
.hex b{position:relative;font-family:var(--display);font-weight:900;font-size:5.4cqw;text-shadow:0 0 1.5cqw #000}
.skill strong{font-family:var(--display);font-weight:900;font-size:7cqw;letter-spacing:.08em;white-space:nowrap;color:#fff6e0;text-shadow:0 .4cqw 0 #3a0808, 0 0 2cqw #000}
.pow{display:flex;align-items:baseline;gap:1cqw;font-size:3.4cqw;white-space:nowrap;padding:.4cqw 2.4cqw;border:.35cqw solid var(--gold);border-radius:1cqw;background:#0009}
.pow em{font-family:Georgia,serif;font-weight:700;font-size:6.4cqw;color:transparent;background:linear-gradient(180deg,var(--gold-hi),#e3a93c);-webkit-background-clip:text;background-clip:text}
.eff{position:relative;display:flex;flex-direction:column;align-items:flex-start}
.eff .tab{font-family:var(--display);font-weight:900;font-size:3.6cqw;letter-spacing:.12em;padding:.4cqw 3cqw;margin-left:2cqw;
  border:.35cqw solid var(--gold);border-bottom:0;border-radius:1.2cqw 1.2cqw 0 0;background:linear-gradient(180deg,#3a1a10,#1a0b0c);color:var(--gold-hi)}
.eff p{margin:0;width:100%;font-size:3.7cqw;line-height:1.55;padding:1.8cqw 2.6cqw;text-align:center;
  border:.35cqw solid var(--gold);border-radius:1.4cqw;background:linear-gradient(180deg,#1d0c10f0,#0d070bf0);text-shadow:0 1px 2px #000}
.stats{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:1.2cqw}
.stats .stat:first-child{grid-column:1/-1}
.stat{display:flex;align-items:center;justify-content:space-between;gap:1cqw;font-size:3.2cqw;white-space:nowrap;
  padding:.8cqw 2.2cqw;border:.35cqw solid var(--gold);border-radius:1cqw 3cqw 1cqw 3cqw;background:#0b0609e6}
.stat .stars{font-size:3.8cqw;letter-spacing:.2cqw;color:#ffd75e;text-shadow:0 0 1.4cqw #ffb800}
.stat .stars s{text-decoration:none;color:#ffffff40;text-shadow:none}
.stat em{font-style:italic;font-family:Georgia,serif;font-weight:700;font-size:5cqw;line-height:1;color:transparent;background:linear-gradient(180deg,var(--gold-hi),#e3a93c);-webkit-background-clip:text;background-clip:text}
.stat .rt{font-size:4.4cqw;background-image:var(--rg)}
.sparkle{position:absolute;inset:0;pointer-events:none;z-index:3;
  background:
    radial-gradient(.8cqw .8cqw at 14% 9%, #fff 40%, transparent), radial-gradient(.6cqw .6cqw at 88% 30%, #fff 40%, transparent),
    radial-gradient(.7cqw .7cqw at 8% 60%, #fff 40%, transparent), radial-gradient(.6cqw .6cqw at 93% 72%, #fff 40%, transparent),
    radial-gradient(.5cqw .5cqw at 50% 97%, #fff 40%, transparent);
  animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.25}}

.act{min-width:200px;font-size:18px;padding:14px 34px}

/* done / judge */
.done{width:100%;max-width:560px;text-align:center}
.done h2{font-family:var(--display);font-weight:900;font-size:30px;margin:6px 0 4px;letter-spacing:.08em}
.done > p{color:var(--mist);margin:0 0 20px}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.hold{position:relative;overflow:hidden;border:1px solid var(--brass);background:transparent;color:var(--brass);border-radius:999px;padding:12px 22px;font-weight:700;user-select:none;-webkit-user-select:none;touch-action:none}
.hold .fill{position:absolute;inset:0;background:#d6b06a33;transform-origin:left;transform:scaleX(0)}
.hold.going .fill{transform:scaleX(1);transition:transform .9s linear}
.hold span{position:relative}
.judge{margin-top:22px;text-align:left}
.jlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.jrow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.jrow .no{font-variant-numeric:tabular-nums;color:var(--mist);font-size:13px;min-width:3.2em}
.jrow .chip{width:32px;height:32px;font-size:16px;border-radius:8px}
.jrow .rn{font-weight:700;min-width:0}
.order{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.order ol{margin:6px 0 0;padding-left:1.4em;color:var(--moon)}
.order li{margin:2px 0}
.order li small{color:var(--mist)}

/* card back artwork */
.back.imgback{padding:0;background:#05040a}
.back.imgback::before{content:none}
.card:not(.flipped) .back.imgback{animation:breathe 2.6s ease-in-out infinite}

/* whole-card image face */
.front.imgcard{padding:0;background:#05040a;animation:none;border-radius:var(--corner)}
.cardimg{position:relative;display:block;width:100%;height:100%;object-fit:cover;border-radius:inherit;-webkit-user-drag:none;user-select:none}
.boxed .cardimg{object-fit:contain;border-radius:0;filter:drop-shadow(0 0 3cqw #000c)}
.cardfill{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;filter:blur(5cqw) brightness(.45) saturate(1.3)}
.card.fresh .cardimg{animation:card-in 1.2s .35s ease-out both}
@keyframes card-in{from{filter:brightness(2.4) saturate(.4)}}
/* poker card: 63 x 88 mm with ~3 mm corners */
.scene{--corner:4.8cqw}
.card,.back,.face{border-radius:var(--corner)}
.back::before{border-radius:calc(var(--corner) - 2cqw)}

/* draw effects */
.stage{overflow:clip}
.scene{position:relative}
.card{z-index:1}
.fx{position:absolute;inset:-38%;pointer-events:none;z-index:0;display:grid;place-items:center;--fx:#d6b06a}
.fx > *{grid-area:1/1}
.rays{width:100%;aspect-ratio:1;border-radius:50%;opacity:0;
  background:repeating-conic-gradient(from 0deg, var(--fx) 0 5deg, transparent 5deg 15deg);
  -webkit-mask:radial-gradient(circle, #000 18%, transparent 66%);mask:radial-gradient(circle, #000 18%, transparent 66%)}
.fx.go .rays{animation:rays-in 1.1s ease-out forwards, spin 18s linear infinite}
@keyframes rays-in{0%{opacity:0;scale:.3}25%{opacity:.95}100%{opacity:.35;scale:1}}
@keyframes spin{to{rotate:360deg}}
.flash{width:62%;aspect-ratio:1;border-radius:50%;opacity:0;background:radial-gradient(circle,#fff 0,var(--fx) 35%,transparent 70%)}
.fx.go .flash{animation:flash 1s ease-out}
@keyframes flash{0%{opacity:0;scale:.2}22%{opacity:1}100%{opacity:0;scale:2.4}}
#sparks{width:100%;height:100%}
.card:not(.flipped) .back{animation:holo 7s linear infinite, breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 18px 50px #000a, inset 0 0 0 1px #d6b06aaa, 0 0 38px #d6b06a55}}
.card.charging{animation:charge .5s ease-in}
.card.charging .back{animation:none;box-shadow:0 0 0 2px #f3d48c, 0 0 70px #f3d48caa, 0 18px 50px #000a}
@keyframes charge{0%{transform:none}20%{transform:rotate(-2.5deg) scale(1.02)}40%{transform:rotate(2.5deg) scale(1.04)}60%{transform:rotate(-2deg) scale(1.06)}80%{transform:rotate(1.5deg) scale(1.08)}100%{transform:scale(1.04)}}

.shine{position:absolute;inset:0;z-index:2;pointer-events:none;transform:translateX(-130%);
  background:linear-gradient(105deg,transparent 35%,#ffffffb0 48%,transparent 60%)}
.card.fresh .shine{animation:shine 1s .55s ease-out forwards}
@keyframes shine{to{transform:translateX(130%)}}
.card.fresh .title,.card.fresh .rar{animation:pop .75s .45s cubic-bezier(.2,1.7,.4,1) both}
.card.fresh .art,.card.fresh .gen{animation:zoom-in 1.4s .3s ease-out both}
@keyframes pop{0%{scale:.2;opacity:0}100%{scale:1;opacity:1}}
@keyframes zoom-in{from{scale:1.18;opacity:.2;filter:brightness(2.2)}}
.card.fresh .skill,.card.fresh .eff,.card.fresh .stats,.card.fresh .campb{animation:rise .5s .85s ease-out both}
.card.fresh .eff{animation-delay:.95s}.card.fresh .stats{animation-delay:1.05s}

/* moderator script */
.script{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-bottom:28px;
  --phase-bg:#141a33;--phase-ink:#b9c6f0;--phase-line:#34407066}

  background:var(--phase-bg);border:1px solid var(--phase-line);border-radius:999px;padding:4px 14px}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden}

.who{font-weight:700}
.hold-by{font-size:13px;color:var(--mist);font-variant-numeric:tabular-nums}
.quote{font-family:var(--display);font-weight:600;font-size:clamp(22px,6vw,28px);line-height:1.55;margin:16px 0 0;text-wrap:pretty}

.note .nt{display:inline-flex;align-items:center;gap:6px;color:var(--brass);font-weight:700;letter-spacing:.06em;margin-right:.6em}
.nav{display:grid;grid-template-columns:1fr 2fr;gap:10px}

.outline li button::before{content:"";position:absolute;left:11px;top:13px;width:7px;height:7px;border-radius:50%;background:#5b6aa0}
.outline li.day button::before{background:#c9a35a}
.outline li.past button{opacity:.5}
.outline li.now button{background:var(--panel);color:var(--moon);font-weight:500}
.outline li button:hover{background:var(--panel)}
.outline li.day:not(.day ~ .day) {margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}

/* graveyard */
.hold-by s{color:var(--blood)}
.note.warn{color:#f0b3ad}
.note.warn .nt{color:var(--blood)}

function suggest(n){
  const r = {};
  const wolves = n < 6 ? 1 : Math.floor(n / 3);
  const gods = ['seer'];
  if (n >= 5) gods.push('witch');
  if (n >= 7) gods.push('hunter');
  if (n >= 10) gods.push('guard');
  if (n >= 12) gods.push('idiot');
  if (n >= 15) gods.push('knight');
  let plain = wolves;
  if (n >= 11){ r.wolfking = 1; plain--; }
  if (n >= 14){ r.whitewolf = 1; plain--; }
  r.werewolf = plain;
  gods.forEach(g => r[g] = 1);
  r.villager = n - wolves - gods.length;
  return r;
}

function shuffle(a){
  const buf = new Uint32Array(a.length);
  crypto.getRandomValues(buf);
  for (let i = a.length - 1; i > 0; i--){
    const j = buf[i] % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

}

const flipMs = () => matchMedia('(prefers-reduced-motion: reduce)').matches ? 150 : 760;
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
let rafId = 0;
function stopFx(){
  cancelAnimationFrame(rafId);
  const fx = document.getElementById('fx'); if (fx) fx.classList.remove('go');
  const cv = document.getElementById('sparks'); if (cv) cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
}
function burst(r){
  const fx = document.getElementById('fx'); if (!fx) return;
  const rf = RAR_FX[EX[r.id].rar];
  fx.style.setProperty('--fx', rf.glow);
  document.getElementById('front').style.setProperty('--glow', rf.glow);
  fx.classList.toggle('ur', EX[r.id].rar === 'UR');
  fx.classList.remove('go'); void fx.offsetWidth; fx.classList.add('go');
  const cv = document.getElementById('sparks');
  const dpr = Math.min(2, window.devicePixelRatio || 1), w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = rf.colors.concat(r.c[1]);
  const count = rf.n;
  const ps = Array.from({ length: count }, () => {
    const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 8;
    return { x: w / 2, y: h / 2, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.5, life: 1,
      dec: .007 + Math.random() * .013, r: .8 + Math.random() * 2.8, c: colors[Math.random() * colors.length | 0] };
  });
  cancelAnimationFrame(rafId);
  const tick = () => {
    ctx.clearRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';
    let alive = 0;
    for (const p of ps){
      if (p.life <= 0) continue;
      alive++;
      p.x += p.vx; p.y += p.vy; p.vx *= .965; p.vy = p.vy * .965 + .07; p.life -= p.dec;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
    if (alive) rafId = requestAnimationFrame(tick); else ctx.clearRect(0, 0, w, h);
  };
  tick();
}
function toggleCard(){
  if (busy) return;
  const card = document.getElementById('card');
  if (S.revealed){
    S.revealed = false;
    card.classList.remove('flipped', 'fresh');
    stopFx();
    updateDealUI();
    return;
  }
  fillFront();
  const r = BY[S.deck[S.idx]];
  const first = !S.seen;
  S.revealed = true; S.seen = true;
  if (first && !reduced()){
    // draw: charge up, flip, then burst
    busy = true;
    try { navigator.vibrate && navigator.vibrate([20, 60, 40]); } catch (e) {}
    card.classList.add('charging');
    updateDealUI();
    setTimeout(() => {
      card.classList.remove('charging');
      card.classList.add('flipped', 'fresh');
      setTimeout(() => { burst(r); busy = false; updateDealUI(); }, 330);
    }, 500);
    return;
  }
  card.classList.add('flipped');
  updateDealUI();
}
function nextPlayer(){
  if (busy || !S.seen) return;
  busy = true;
  const card = document.getElementById('card');
  const wasOpen = S.revealed;
  S.revealed = false;
  card.classList.remove('flipped', 'fresh');
  stopFx();
  updateDealUI();
  // swap in the next player only after the card is fully face-down
  setTimeout(() => {
    const front = document.getElementById('front');
    front.className = 'face front blank'; front.innerHTML = ''; front.removeAttribute('style');
    S.idx++; S.seen = false;
    busy = false;
    if (S.idx >= S.n){ S.phase = 'done'; render(); return; }
    updateDealUI();
  }, wasOpen ? flipMs() : 0);
}

/* ---------- moderator script ---------- */
function holders(who){
  const ids = who === 'wolves'
    ? S.deck.map((id, i) => [id, i]).filter(([id]) => BY[id].camp === 'wolf' && id !== 'hiddenwolf')
    : S.deck.map((id, i) => [id, i]).filter(([id]) => id === who);
  return ids.map(([, i]) => i + 1);
}
function buildRound(k){
  const has = id => S.deck.includes(id);
  const wolvesAwake = S.deck.some(id => BY[id].camp === 'wolf' && id !== 'hiddenwolf');
  const st = [];
  const N = (who, line, note = '') => st.push({ ph: 'night', who, line, note });
  const D = (who, line, note = '') => st.push({ ph: 'day', who, line, note });
  const DS = (line, note = '') => st.push({ ph: 'day', who: null, badge: 'sheriff', line, note });
  const and = (...xs) => xs.filter(Boolean).join(' ');

  N(null, '天黑請閉眼。', '確認所有玩家都閉上眼睛。可以請大家輕拍大腿，蓋住睜眼和指人的聲音。');
  if (k === 1 && has('cupid')){
    N('cupid', '丘比特請睜眼。請選擇兩名玩家成為戀人。', '記下兩位戀人的號碼。');
    N('cupid', '丘比特請閉眼。');
    N(null, '我拍到肩膀的玩家請睜眼，你們是戀人，請互相確認。', '輕拍兩位戀人的肩膀。');
    N(null, '戀人請閉眼。');
  }
  if (has('guard')){
    N('guard', '守衛請睜眼。你今晚要守護誰？', '不能連續兩晚守同一人，可以選擇空守。記下守護對象。');
    N('guard', '守衛請閉眼。');
  }
  if (wolvesAwake){
    N('wolves', k === 1 ? '狼人請睜眼，請互相確認身份。' : '狼人請睜眼。', has('hiddenwolf') ? '隱狼不睜眼，也不參與刀人。' : '');
    N('wolves', '狼人請決定今晚要擊殺的對象，請統一指向一名玩家。', '記下刀口。狼人也可以選擇空刀。');
    if (has('wolfbeauty')) N('wolfbeauty', '狼美人請選擇今晚要魅惑的玩家。', '記下魅惑對象。');
    N('wolves', '狼人請閉眼。');
  }
  if (has('witch')){
    N('witch', '女巫請睜眼。今晚死的是他（比出刀口號碼）。你要使用解藥嗎？', '解藥用過後，之後的夜晚不再告知刀口。常見規則：女巫只有第一晚可以自救。');
    N('witch', '你要使用毒藥嗎？要毒誰？', '同一晚不能同時使用解藥和毒藥。');
    N('witch', '女巫請閉眼。');
  }
  if (has('seer')){
    N('seer', '預言家請睜眼。你今晚要查驗誰？');
    N('seer', '他的身份是（好人比讚，狼人比倒讚）。', and(has('hiddenwolf') && '隱狼被查驗時結果是好人。', has('mixed') && `混血兒依本局隨機到的陣營回答：${mixedSideName()}。`));
    N('seer', '預言家請閉眼。');
  }
  if (k > 1 && has('gravekeeper')){
    N('gravekeeper', '守墓人請睜眼。昨天被放逐的玩家是（好人比讚，狼人比倒讚）。');
    N('gravekeeper', '守墓人請閉眼。');
  }
  ['hunter', 'wolfking'].forEach(id => {
    if (!has(id)) return;
    N(id, `${BY[id].name}請睜眼。你今晚的開槍狀態是（可以開槍比讚，不能開槍比倒讚）。`, and('被女巫毒死時不能開槍。', id === 'hunter' && has('hiddenwolf') && '獵人不能開槍帶走隱狼。'));
    N(id, `${BY[id].name}請閉眼。`);
  });

  D(null, '天亮了，請大家睜眼。');
  if (k === 1 && S.sheriff){
    DS('現在開始警長競選。想競選警長的玩家請舉手。', '舉手的玩家上警，其餘玩家在警下。');
    DS('請上警的玩家依序發表競選宣言。', '發言中可以退水（退出競選），退水後不能再上警。');
    DS('請警下的玩家投票。三、二、一，請指向你支持的警長。', '上警玩家沒有投票權。平票時平票玩家再發言一輪後重投，再平票則本局沒有警長。');
    DS('（___ 號玩家）當選警長。', '警長的票算 1.5 票，並決定之後白天的發言順序。');
  }
  st.push({ ph: 'day', who: null, announce: true, line: '昨晚（___ 號玩家死亡／是平安夜）。', note: '' });
  st[st.length - 1].note = and(
    '結算刀口、守護、解藥、毒藥。',
    has('guard') && has('witch') && '同一人被守衛守護又被女巫救，仍然會死亡（同守同救）。',
    has('cupid') && '戀人其中一人出局時，另一人也一同出局。',
    has('wolfbeauty') && '昨晚被狼美人魅惑的好人，今天不能發言也不能投票。');
  D(null, k === 1 ? '請昨晚死亡的玩家發表遺言。' : '昨晚死亡的玩家請離場。', k === 1 ? '常見規則：只有首夜死亡的玩家有遺言。' : '依你們的規則決定夜裡死亡是否有遺言。');
  if (has('hunter') || has('wolfking')) D(null, '出局的玩家如果有開槍技能，現在可以發動。', '被毒死的獵人或狼王不能開槍。');
  if (S.sheriff) DS('如果出局的玩家是警長，請移交警徽或撕毀警徽。', '警徽可以交給任一存活玩家；撕毀後本局不再有警長。');
  D(null, S.sheriff ? '請警長決定發言順序，從（___ 號玩家）開始依序發言，警長最後發言歸票。' : '請從（___ 號玩家）開始，依序發言。', and(
    has('whitewolf') && '白狼王被投票出局時可自爆並帶走一名玩家，立刻進入黑夜。',
    has('knight') && '騎士可在發言時翻牌決鬥一名玩家。'));
  D(null, '發言結束，現在開始投票。三、二、一，請指向你要放逐的玩家。', and(S.sheriff && '警長的票算 1.5 票。', '平票時可讓平票玩家再各發言一輪後重投。'));
  D(null, '（___ 號玩家）被放逐，請發表遺言。', and(
    S.sheriff && '被放逐的若是警長，請移交或撕毀警徽。',
    has('idiot') && '白痴被放逐時可翻牌免死，但之後失去投票權。',
    '檢查勝負：狼人殺光所有神職或所有平民就獲勝；所有狼人出局則好人獲勝。'));
  return st;
}
function scriptSteps(){ return buildRound(S.k); }
function lineHTML(t){
  return t.replace(/（[^）]*）/g, m => `<span class="sd">${m}</span>`);
}
function speak(t){
  try {
    if (!S.tts || !window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t.replace(/（[^）]*）/g, '').replace(/_+/g, '幾'));
    u.lang = 'zh-TW'; u.rate = 0.95;
    speechSynthesis.speak(u);
  } catch (e) {}
}
let showIds = false;
function renderScript(){
  const steps = scriptSteps(), s = steps[S.step];
  const night = s.ph === 'night';
  const role = s.who === 'wolves' ? BY.werewolf : s.who ? BY[s.who] : null;
  const who = s.who ? holders(s.who) : [];
  const nightN = steps.filter(x => x.ph === 'night').length;
  app.innerHTML = `
    <div class="script ${night ? 'is-night' : 'is-day'}">
      <div class="sbar"><div class="topline">
        <span class="phase"><i class="fa-solid fa-${night ? 'moon' : 'sun'}" aria-hidden="true"></i>${night ? '第 ' + S.k + ' 夜' : '第 ' + S.k + ' 天'}</span>
        <div class="tl-btns">
          <button class="ghost" id="ids" aria-pressed="${showIds}"><i class="fa-solid fa-id-card" aria-hidden="true"></i><span class="lbl">${showIds ? '收起身份表' : '身份表'}</span></button>
          <button class="ghost" id="leave"><i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i><span class="lbl">離開</span></button>
        </div>
      </div>
      <div class="prog"><i style="width:${((S.step + 1) / steps.length * 100).toFixed(1)}%"></i></div></div>
      <div class="s-main">
      ${showIds ? `<div class="jlist ids">${idRows()}</div>` : ''}
      <article class="say">
        <div class="say-head">
          ${role ? `<span style="${vars(role)}">${chip(role)}</span>` : `<span class="chip judge-chip" style="background-image:url('${s.badge === 'sheriff' ? BACK.sheriff : BACK.god}')" role="img" aria-label="${s.badge === 'sheriff' ? '警長' : '上帝'}"></span>`}
          <div><div class="who">${s.who === 'wolves' ? '狼人' : role ? role.name : s.badge === 'sheriff' ? '上帝 · 警長流程' : '上帝'}</div>
          <div class="hold-by">${s.who ? '玩家 ' + who.map(n => isDead(n - 1) ? `<s>${n}</s>（已出局）` : n).join('、') : (night ? '夜晚' : '白天') + ' · 第 ' + (S.step + 1) + ' / ' + steps.length + ' 句'}</div></div>
        </div>
        <p class="quote">${lineHTML(s.line)}</p>
        ${s.who && who.length && who.every(n => isDead(n - 1)) ? `<p class="note warn"><b class="nt"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i> 注意</b>這個角色已全部出局。照常念台詞並停頓幾秒，避免洩漏身份。</p>` : ''}
        ${s.announce ? announceHTML() : ''}
        ${s.note ? `<p class="note"><b class="nt"><i class="fa-solid fa-lightbulb" aria-hidden="true"></i> 上帝提示</b>${s.note}</p>` : ''}
        <p class="swipe-hint"><i class="fa-solid fa-arrows-left-right" aria-hidden="true"></i> 左右滑動這張卡也能切換台詞</p>
      </article>
      ${winHTML()}
      <label class="tts"><button class="switch" id="tts" aria-pressed="${!!S.tts}" style="--c2:var(--brass)" aria-label="朗讀台詞"></button><i class="fa-solid fa-volume-high" aria-hidden="true"></i> 朗讀台詞</label>
      <div class="nav">
        <button class="ghost" id="prev" ${S.k === 1 && S.step === 0 ? 'disabled' : ''}><i class="fa-solid fa-chevron-left" aria-hidden="true"></i>上一句</button>
        <button class="primary" id="next">${S.step === steps.length - 1 ? `<i class="fa-solid fa-moon" aria-hidden="true"></i>進入第 ${S.k + 1} 夜` : `下一句<i class="fa-solid fa-chevron-right" aria-hidden="true"></i>`}</button>
      </div>
      </div>
      <aside class="s-side">
      ${graveHTML(s)}
      <section class="outline-wrap"><p class="label"><i class="fa-solid fa-list-ol" aria-hidden="true"></i> 本輪流程</p>
      <ol class="outline">${steps.map((x, i) => `
        <li class="${i === S.step ? 'now' : i < S.step ? 'past' : ''} ${x.ph}" ${i === nightN ? 'data-sun' : ''}><button data-jump="${i}">${x.line.replace(/（[^）]*）/g, '…')}</button></li>`).join('')}
      </ol></section>
      </aside>
    </div>`;
}
/* ---------- graveyard ---------- */
const CAUSES = ['狼刀', '毒殺', '放逐', '開槍', '殉情', '自爆', '決鬥', '其他'];
const CAUSE_ICON = { 狼刀: 'paw', 毒殺: 'flask', 放逐: 'gavel', 開槍: 'gun', 殉情: 'heart-crack', 自爆: 'bomb', 決鬥: 'khanda', 其他: 'circle-question' };
let pick = null; // player index being marked
const isDead = i => !!(S.dead && S.dead[i]);
function whenNow(){
  const s = scriptSteps()[S.step];
  return s.ph === 'night' ? `第 ${S.k} 夜` : `第 ${S.k} 天`;
}
function markDead(i, cause){
  S.dead = S.dead || {};
  S.dead[i] = { cause, when: whenNow(), order: Object.keys(S.dead).length };
}
function announceHTML(){
  const tonight = Object.entries(S.dead || {}).filter(([, d]) => d.when === `第 ${S.k} 夜`);
  const txt = tonight.length
    ? '昨晚 ' + tonight.map(([i]) => (+i + 1)).join('、') + ' 號玩家死亡。'
    : '昨晚是平安夜。';
  return `<p class="note record"><b><i class="fa-solid fa-bullhorn" aria-hidden="true"></i> 依墓地紀錄可念：</b>${txt}${tonight.length ? '<br><small>' + tonight.map(([i, d]) => `玩家 ${+i + 1}：${d.cause}`).join('　') + '（死因不要公布）</small>' : '<br><small>若有人死亡，先在下方玩家狀態點選標記</small>'}</p>`;
}
const mixedSideName = () => S.mixedSide === 'wolf' ? '狼人陣營' : '好人陣營';
const campOf = id => id === 'mixed' ? (S.mixedSide === 'wolf' ? 'wolf' : 'villager') : BY[id].camp;
const roleLabel = id => BY[id].name + (id === 'mixed' && S.mixedSide ? `（${mixedSideName()}）` : '');
function winHTML(){
  if (!S.dead || !Object.keys(S.dead).length) return '';
  const alive = S.deck.map((id, i) => [id, i]).filter(([, i]) => !isDead(i)).map(([id]) => campOf(id));
  const total = c => S.deck.filter(id => campOf(id) === c).length;
  const left = c => alive.filter(x => x === c).length;
  let msg = '';
  if (total('wolf') && !left('wolf')) msg = '所有狼人已出局：好人陣營獲勝';
  else if (total('god') && !left('god')) msg = '神職已全部出局：狼人陣營獲勝（屠神）';
  else if (total('villager') && !left('villager')) msg = '平民已全部出局：狼人陣營獲勝（屠民）';
  return msg ? `<div class="win" role="status"><b><i class="fa-solid fa-trophy" aria-hidden="true"></i> 遊戲結束？</b>${msg}<small>有戀人時請依你們的規則判斷</small></div>` : '';
}
function graveHTML(){
  const deadList = Object.entries(S.dead || {}).sort((a, b) => a[1].order - b[1].order);
  const aliveN = S.deck.length - deadList.length;
  const picker = pick === null ? '' : isDead(pick)
    ? `<div class="picker"><span>玩家 ${pick + 1} 已出局</span><button class="ghost" data-revive="${pick}"><i class="fa-solid fa-heart-pulse" aria-hidden="true"></i>復活（標錯了）</button><button class="ghost" id="pick-cancel"><i class="fa-solid fa-xmark" aria-hidden="true"></i>取消</button></div>`
    : `<div class="picker"><span>玩家 ${pick + 1} 的出局原因（${whenNow()}）</span>${CAUSES.map(c => `<button class="cause" data-cause="${c}"><i class="fa-solid fa-${CAUSE_ICON[c]}" aria-hidden="true"></i>${c}</button>`).join('')}<button class="ghost" id="pick-cancel"><i class="fa-solid fa-xmark" aria-hidden="true"></i>取消</button></div>`;
  return `<section class="grave">
    <div class="g-head"><p class="label"><i class="fa-solid fa-user-group" aria-hidden="true"></i> 玩家狀態</p><span>存活 ${aliveN} · 出局 ${deadList.length}</span></div>
    <div class="pgrid">${S.deck.map((id, i) => { const r = BY[id]; return `
      <button class="pchip ${isDead(i) ? 'dead' : ''} ${pick === i ? 'sel' : ''}" data-p="${i}" style="${vars(r)}" aria-label="玩家 ${i + 1} ${r.name}${isDead(i) ? ' 已出局' : ''}">
        <b>${i + 1}</b>${chip(r)}
      </button>`; }).join('')}
    </div>
    ${picker}
    <div class="g-head"><p class="label"><i class="fa-solid fa-skull" aria-hidden="true"></i> 墓地</p><span>${deadList.length ? '依出局順序' : ''}</span></div>
    ${deadList.length ? `<div class="tombs">${deadList.map(([i, d]) => { const r = BY[S.deck[i]]; return `
      <div class="tomb" style="${vars(r)}">
        <i class="fa-solid fa-cross" aria-hidden="true"></i>
        <span class="t-no">玩家 ${+i + 1}</span>
        <span class="t-role">${chip(r)}${roleLabel(S.deck[i])}</span>
        <span class="t-meta"><i class="fa-solid fa-${CAUSE_ICON[d.cause] || 'circle-question'}" aria-hidden="true"></i>${d.when} · ${d.cause}</span>
      </div>`; }).join('')}</div>` : '<p class="empty">還沒有人出局。點上方玩家號碼即可標記死亡。</p>'}
  </section>`;
}

function idRows(){
  return S.deck.map((id, i) => { const r = BY[id]; return `
    <div class="jrow" style="${vars(r)}"><span class="no">玩家 ${i + 1}</span>${chip(r)}<span class="rn">${roleLabel(id)}</span></div>`; }).join('');
}
function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0, y); }
function go(delta){
  pick = null;
  const steps = scriptSteps();
  let i = S.step + delta;
  if (i >= steps.length){ S.k++; i = 0; }
  else if (i < 0){ if (S.k === 1) return; S.k--; i = buildRound(S.k).length - 1; }
  S.step = i;
  renderScript();
  window.scrollTo(0, 0);
  buzz(8);
  speak(scriptSteps()[S.step].line);
}

let holdTimer = null;
function holdStart(){
  const b = document.getElementById('hold'); if (!b) return;
  if (judgeOpen){ judgeOpen = false; renderDone(); return; }
  b.classList.add('going');
  holdTimer = setTimeout(() => { judgeOpen = true; renderDone(); }, 900);
}
function holdEnd(){
  clearTimeout(holdTimer); holdTimer = null;
  const b = document.getElementById('hold'); if (b) b.classList.remove('going');
}

/* ---------- wiring ---------- */
function render(){
  if (S.phase === 'setup') renderSetup();
  else if (S.phase === 'deal') renderDeal();
  else if (S.phase === 'script') renderScript();
  else renderDone();
}
app.addEventListener('click', e => {
  const t = e.target.closest('button, #card, .tile[data-tog], .rule');
  if (!t) return;
  if (S.phase === 'setup'){
    if (t.id === 'n-minus' && S.n > MIN){ S.n--; }
    else if (t.id === 'n-plus' && S.n < MAX){ S.n++; }
    else if (t.id === 'auto'){ S.roles = suggest(S.n); }
    else if (t.id === 'sheriff' || t.dataset.rule === 'sheriff'){ S.sheriff = !S.sheriff; }
    else if (t.id === 'start'){ if (total() === S.n) startDeal(); return; }
    else if (t.dataset.inc){ const r = BY[t.dataset.inc]; S.roles[r.id] = Math.min(r.max, (S.roles[r.id] || 0) + 1); }
    else if (t.dataset.dec){ const id = t.dataset.dec; S.roles[id] = Math.max(0, (S.roles[id] || 0) - 1); }
    else if (t.dataset.tog){ const id = t.dataset.tog; S.roles[id] = S.roles[id] ? 0 : 1; }
    else return;
    save();
    const y = window.scrollY; renderSetup(); window.scrollTo(0, y);
    const again = t.id ? document.getElementById(t.id) : document.querySelector(`[data-${t.dataset.inc ? 'inc' : t.dataset.dec ? 'dec' : 'tog'}="${t.dataset.inc || t.dataset.dec || t.dataset.tog}"]`);
    if (again && !again.disabled) again.focus({ preventScroll: true });
  } else if (S.phase === 'deal'){
    if (t.id === 'card') toggleCard();
    else if (t.id === 'act') nextPlayer();
    else if (t.id === 'exit'){
      if (exitArm){ clearTimeout(exitArm); exitArm = null; S.phase = 'setup'; S.revealed = false; render(); return; }
      t.innerHTML = `<i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>再點一次確認結束`;
      exitArm = setTimeout(() => { exitArm = null; const b = document.getElementById('exit'); if (b) b.innerHTML = `<i class="fa-solid fa-xmark" aria-hidden="true"></i>結束發牌`; }, 3000);
    }
  } else if (S.phase === 'script'){
    if (t.id === 'next') go(1);
    else if (t.id === 'prev') go(-1);
    else if (t.dataset.jump){ S.step = +t.dataset.jump; renderScript(); speak(scriptSteps()[S.step].line); }
    else if (t.id === 'ids'){ showIds = !showIds; renderScript(); }
    else if (t.dataset.p !== undefined){ const i = +t.dataset.p; pick = pick === i ? null : i; keepScroll(renderScript); }
    else if (t.dataset.cause){ markDead(pick, t.dataset.cause); pick = null; keepScroll(renderScript); }
    else if (t.dataset.revive !== undefined){ delete S.dead[+t.dataset.revive]; pick = null; keepScroll(renderScript); }
    else if (t.id === 'pick-cancel'){ pick = null; keepScroll(renderScript); }
    else if (t.id === 'tts'){ S.tts = !S.tts; if (S.tts) speak(scriptSteps()[S.step].line); else { try { speechSynthesis.cancel(); } catch (e) {} } renderScript(); }
    else if (t.id === 'leave'){ try { speechSynthesis.cancel(); } catch (e) {} showIds = false; S.phase = 'done'; render(); window.scrollTo(0, 0); }
  } else {
    if (t.id === 'play'){ judgeOpen = false; wake(); if (!S.k){ S.k = 1; S.step = 0; } S.phase = 'script'; render(); window.scrollTo(0, 0); speak(scriptSteps()[S.step].line); }
    else if (t.id === 'again'){ judgeOpen = false; startDeal(); }
    else if (t.id === 'back'){ judgeOpen = false; S.phase = 'setup'; render(); window.scrollTo(0, 0); }
  }
});
app.addEventListener('keydown', e => {
  if (e.target.id === 'card' && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); toggleCard(); }
  if (e.target.id === 'hold' && (e.key === 'Enter' || e.key === ' ') && !e.repeat){ e.preventDefault(); holdStart(); }
});
// swipe the line card left/right to move through the script
let sw = null;
app.addEventListener('touchstart', e => {
  if (S.phase !== 'script' || !e.target.closest('.say')) { sw = null; return; }
  const p = e.touches[0]; sw = { x: p.clientX, y: p.clientY };
}, { passive: true });
app.addEventListener('touchend', e => {
  if (!sw) return;
  const p = e.changedTouches[0], dx = p.clientX - sw.x, dy = p.clientY - sw.y;
  sw = null;
  if (Math.abs(dx) > 60 && Math.abs(dy) < 50) go(dx < 0 ? 1 : -1);
}, { passive: true });
document.addEventListener('keydown', e => {
  if (S.phase !== 'script' || e.target.closest('input, textarea')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown'){ e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); go(-1); }
});
app.addEventListener('keyup', e => { if (e.target.id === 'hold') holdEnd(); });
app.addEventListener('pointerdown', e => { if (e.target.closest('#hold')) holdStart(); });
['pointerup','pointerleave','pointercancel'].forEach(ev => app.addEventListener(ev, e => { if (e.target.closest && e.target.closest('#hold')) holdEnd(); }, true));
app.addEventListener('contextmenu', e => { if (e.target.closest('#hold')) e.preventDefault(); });

/* keep an in-progress deal across live updates of the page */
function boot(data){
  if (data && data.S && data.S.roles) S = data.S;
  busy = false;
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
